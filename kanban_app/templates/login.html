{% extends 'base.html' %}
{% load static %}


{% block content %}
<style>
  .login-bg {
    position: relative;
    min-height: 100vh;
    width: 100%;
    background: linear-gradient(135deg, #e8f4fd 0%, #f0f7ff 40%, #e8f0fe 70%, #f5f0ff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 1rem;
  }

  /* Decorative blobs */
  .login-bg::before {
    content: '';
    position: absolute;
    top: -120px;
    left: -120px;
    width: 480px;
    height: 480px;
    background: radial-gradient(circle, rgba(255,86,48,0.12) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .login-bg::after {
    content: '';
    position: absolute;
    bottom: -100px;
    right: -100px;
    width: 420px;
    height: 420px;
    background: radial-gradient(circle, rgba(66,133,244,0.10) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* Floating shapes */
  .login-shape {
    position: absolute;
    pointer-events: none;
    opacity: 0.55;
  }
</style>

<main class="login-bg">
  <!-- Decorative SVG shapes left side -->
  <div class="login-shape" style="left: 3%; top: 15%;">
    <svg width="180" height="220" viewBox="0 0 180 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Person working at board -->
      <rect x="20" y="30" width="100" height="70" rx="6" fill="#d0e8ff" stroke="#a0c8f0" stroke-width="2"/>
      <rect x="30" y="42" width="18" height="14" rx="2" fill="#4285F4" opacity="0.7"/>
      <rect x="55" y="42" width="18" height="14" rx="2" fill="#ff5630" opacity="0.7"/>
      <rect x="80" y="42" width="18" height="14" rx="2" fill="#36b37e" opacity="0.7"/>
      <rect x="30" y="62" width="30" height="10" rx="2" fill="#a0c8f0"/>
      <rect x="66" y="62" width="20" height="10" rx="2" fill="#a0c8f0"/>
      <!-- Person -->
      <circle cx="140" cy="80" r="16" fill="#ffd6c0"/>
      <rect x="124" y="96" width="32" height="40" rx="8" fill="#ff5630" opacity="0.85"/>
      <line x1="140" y1="136" x2="130" y2="170" stroke="#ffd6c0" stroke-width="6" stroke-linecap="round"/>
      <line x1="140" y1="136" x2="150" y2="170" stroke="#ffd6c0" stroke-width="6" stroke-linecap="round"/>
      <line x1="124" y1="110" x2="108" y2="100" stroke="#ffd6c0" stroke-width="5" stroke-linecap="round"/>
      <!-- Floating card -->
      <rect x="10" y="155" width="70" height="45" rx="6" fill="white" stroke="#d0e0f0" stroke-width="1.5" opacity="0.9"/>
      <rect x="18" y="163" width="28" height="6" rx="2" fill="#4285F4" opacity="0.5"/>
      <rect x="18" y="175" width="45" height="4" rx="2" fill="#ccc"/>
      <rect x="18" y="183" width="35" height="4" rx="2" fill="#ccc"/>
    </svg>
  </div>

  <div class="login-shape" style="left: 1%; bottom: 10%;">
    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="10" width="45" height="45" rx="8" fill="#4285F4" opacity="0.12"/>
      <rect x="65" y="10" width="45" height="45" rx="8" fill="#ff5630" opacity="0.12"/>
      <rect x="10" y="65" width="45" height="45" rx="8" fill="#36b37e" opacity="0.12"/>
      <rect x="65" y="65" width="45" height="45" rx="8" fill="#ffc107" opacity="0.12"/>
    </svg>
  </div>

  <!-- Decorative SVG shapes right side -->
  <div class="login-shape" style="right: 3%; top: 12%;">
    <svg width="200" height="240" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Magnifier -->
      <circle cx="130" cy="70" r="45" stroke="#4285F4" stroke-width="8" fill="white" opacity="0.8"/>
      <circle cx="130" cy="70" r="32" fill="#e8f4fd" opacity="0.9"/>
      <rect x="28" y="58" width="52" height="8" rx="3" fill="#a0c8f0" opacity="0.7"/>
      <rect x="28" y="72" width="38" height="6" rx="3" fill="#ccc" opacity="0.6"/>
      <rect x="28" y="84" width="44" height="6" rx="3" fill="#ccc" opacity="0.6"/>
      <line x1="107" y1="107" x2="85" y2="130" stroke="#4285F4" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
      <!-- Floating chart bar -->
      <rect x="10" y="155" width="16" height="55" rx="4" fill="#ff5630" opacity="0.5"/>
      <rect x="34" y="135" width="16" height="75" rx="4" fill="#4285F4" opacity="0.5"/>
      <rect x="58" y="165" width="16" height="45" rx="4" fill="#36b37e" opacity="0.5"/>
      <rect x="82" y="145" width="16" height="65" rx="4" fill="#ffc107" opacity="0.5"/>
    </svg>
  </div>

  <div class="login-shape" style="right: 2%; bottom: 8%;">
    <svg width="130" height="100" viewBox="0 0 130 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="5" width="120" height="90" rx="10" fill="white" stroke="#d0e0f0" stroke-width="1.5" opacity="0.8"/>
      <rect x="18" y="20" width="40" height="8" rx="3" fill="#ff5630" opacity="0.4"/>
      <rect x="18" y="34" width="90" height="5" rx="2" fill="#ddd"/>
      <rect x="18" y="44" width="75" height="5" rx="2" fill="#ddd"/>
      <rect x="18" y="54" width="85" height="5" rx="2" fill="#ddd"/>
      <rect x="18" y="66" width="35" height="16" rx="4" fill="#ff5630" opacity="0.7"/>
      <rect x="60" y="66" width="35" height="16" rx="4" fill="#e0e0e0"/>
    </svg>
  </div>

    <div class="flex flex-col gap-6 w-full max-w-sm bg-white border border-neutral-100 rounded-md shadow-sm p-6 opacity-95">
        <img src="{% static 'images/logo.webp' %}" alt="Kanboard logo" aria-label="Kanboard logo" class="size-14 object-center block mx-auto">
        <h2 class="text-2xl font-semibold text-center">Log in to Kanboard</h2>
        <form method="POST" class="flex flex-col gap-4">
            {% csrf_token %}
            <div class="flex flex-col gap-2">
                <label for="id_username" class="text-lg font-semibold">Username</label>
                <input type="text" name="username" id="id_username" placeholder="Username" autofocus maxlength="30" required class="px-3 py-2 border border-neutral-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#ff5630]">
            </div>
            <div class="flex flex-col gap-2">
                <label for="id_password" class="text-lg font-semibold">Password</label>
                <input type="password" name="password" id="id_password" placeholder="Password" maxlength="30" required class="px-3 py-2 border border-neutral-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#ff5630]">
            </div>
            {% if form.errors %}
                <p class="text-lg text-red-600">Invalid username or password.</p>
            {% endif %}
            <button type="submit" class="py-2 bg-[#ff5630] text-lg text-white font-semibold rounded-md shadow-sm cursor-pointer hover:bg-red-300 transition-colors">
                Login
            </button>
        </form>
    </div>
</main>
{% endblock %}
